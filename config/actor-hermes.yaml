# SafeClaw — hermes-actor configuration (Composio MCP backend)
# Mounted into the container at /opt/data/config.yaml.
#
# Role: write/action agent. Drafts, posts, and Drive ops via Composio MCP.
# Trust split: has private-data + exfiltration capability but NO untrusted input
# in context — only reads structured observations + receives explicit human commands.

agent:
  name: safeclaw-actor
  system_prompt: |
    You are SafeClaw — the user's personal AI assistant.

    Your memory of the user lives at /opt/brain/. That folder holds their
    contacts, companies, meeting notes, projects, journal, identity docs,
    and resources — populated from their recent Gmail history.

    RULE: For ANY question about a person, topic, meeting, project, or
    "what do you know about X" — your FIRST action is ALWAYS:

        search_files(pattern="<token>", path="/opt/brain/", target="content")

    Use a key token from the question (a name like "Andrew" or "Kroeze",
    a company, a project word). Then read_file each match. THEN answer.

    Do NOT call Gmail / GMAIL_FETCH_EMAILS / web search until you have
    first run search_files on /opt/brain/. Do NOT say "I don't have memory"
    or "let me check email" — check the brain first, every time.

    Brain layout (PARA, 11+ folders — never assume content is only in one):
      /opt/brain/0 - Identity/   — SOUL.md, blueprints, principles (about user)
      /opt/brain/3 - Daily Journal/  — daily entries
      /opt/brain/4 - Meetings/   — meeting & interview notes (YYYY-MM-DD - X.md)
      /opt/brain/5 - Projects/   — active project notes
      /opt/brain/6 - Areas/      — ongoing areas of life
      /opt/brain/7 - Resources/  — reference material
      /opt/brain/People/         — one .md per contact (slug: name-at-domain-com)
      /opt/brain/Companies/      — one .md per sender domain

    Talk to the user in plain English. They cannot see raw tool names.
    Before each tool call, narrate one short sentence:
      ✓ "Looking up Andrew Kroeze in your notes..."
      ✓ "Checking your meeting history..."
      ✗ "Calling search_files..."  ✗ "Invoking GMAIL_FETCH_EMAILS..."

    Capabilities:
      - Read /opt/brain/ (your memory).
      - Draft Gmail replies (drafts only, never send).
      - Post to Slack (approval cards to #safeclaw-review for routine actions).
      - Move/rename files in app-owned Drive folder.

    When drafting an email reply:
      1. read_file the matching /opt/brain/People/<slug>.md for context.
      2. read_file /opt/brain/0 - Identity/SOUL.md for tone cues.
      3. Match the user's voice (terse, opens with the ask).

model:
  # `custom` = generic OpenAI-compatible endpoint (per `hermes setup` hint).
  # We point at local Ollama daemon which proxies :cloud models to ollama.com.
  provider: custom
  base_url: http://host.docker.internal:11434/v1
  api_key: ollama-local
  # Hermes uses `default:` (the default model), not `name:` — unlike most agent runtimes.
  # Kimi K2.5 — Moonshot's agentic model. Far better at tool routing
  # (memory-first protocol, multi-step search) than glm-5.1, which kept
  # improvising past the system prompt.
  default: kimi-k2.5:cloud
  temperature: 0.2
  # Cap output to prevent runaway truncation/continuation loops on small-output models.
  max_tokens: 4096

# ── Toolset pruning ──────────────────────────────────────────────────────────
# Hermes ships 74 bundled skills. Loading all of them into context per turn
# burns ~22K tokens of skill metadata. Restrict the Telegram platform to ONLY
# the toolsets SafeClaw actually needs:
#   - native-mcp : connects to Composio MCP servers (Gmail, Slack, Drive)
#   - file       : read/write local files (brain folder editing)
#   - todo       : in-conversation task tracking
#   - skills     : let agent inspect/use saved skills (lightweight)
# Drops session_meta from ~87 KB to ~15 KB. ~70% context savings per turn.
platform_toolsets:
  telegram: [native-mcp, file, todo, skills]

# ── MCP Servers ──────────────────────────────────────────────────────────────
# Composio actor MCP exposes 10 tools across Gmail (draft + reply), Slack
# (send), Drive (move/find/upload/create_folder).
mcp_servers:
  composio_actor:
    url: "${COMPOSIO_ACTOR_MCP_URL}"
    headers:
      x-api-key: "${COMPOSIO_API_KEY}"
      x-composio-user-id: "${COMPOSIO_USER_ID}"
    timeout: 120
    connect_timeout: 30

# ── Display: hide raw tool names from end-user platforms ────────────────────
# Without this, Telegram/Slack users see literal calls like
# "mcp_composio_actor_GMAIL_FETCH_EMAILS: from:aditya@..." — fine for devs,
# terrible for the customer-facing product. We turn tool progress OFF on
# both Telegram and Slack and rely on the agent narrating its work in
# plain English (the system prompt enforces this in the "HOW YOU TALK TO
# THE USER" section).
display:
  platforms:
    telegram:
      tool_progress: off
      show_reasoning: false
    slack:
      tool_progress: off
      show_reasoning: false

# ── Scheduled automations (cron) ─────────────────────────────────────────────
schedules:
  morning_briefing:
    cron: "0 7 * * *"
    description: "Query obs DB for overnight critical_alerts → post digest to #safeclaw-review"
  reminder_scan:
    cron: "0 15 * * *"
    description: "Tasks due today → reminder cards in #safeclaw-review"
  critical_digest:
    cron: "0 18 * * *"
    description: "Today's critical_alerts summary → #safeclaw-review"

# ── Feature flags ────────────────────────────────────────────────────────────
features:
  auto_send_enabled: "${AUTO_SEND_ENABLED}"   # Phase 4 — gated by 30-day clean run

skills:
  enabled:
    - core
    - mcp/native-mcp
