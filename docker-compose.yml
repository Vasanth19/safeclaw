# SafeClaw AI Assistant — Docker Compose
# All services run on the safeclaw_net bridge network.
# Egress is restricted to *.googleapis.com, *.slack.com, and internal traffic
# via iptables rules applied at host level (see DEPLOY-RUNBOOK.md §Egress Rules).

name: safeclaw

networks:
  safeclaw_net:
    driver: bridge
    # Internal-only flag intentionally NOT set here — egress restriction is handled
    # by iptables allowlist on the host, giving more precise domain-level control.

volumes:
  obs_data:
    name: safeclaw_obs_data
  tasks_data:
    name: safeclaw_tasks_data
  drive_mirror:
    name: safeclaw_drive_mirror
  hermes_reader_data:
    name: safeclaw_hermes_reader_data
  hermes_actor_data:
    name: safeclaw_hermes_actor_data

# ─── Postgres: Observation Database ──────────────────────────────────────────
services:
  postgres-obs:
    # pgvector/pgvector:pg16 = Postgres 16 + pgvector extension preinstalled.
    # Required for the Brain layer (observation_embeddings, fact_embeddings, style_sample_embeddings).
    image: pgvector/pgvector:pg16
    container_name: safeclaw-postgres-obs
    restart: unless-stopped
    networks:
      - safeclaw_net
    environment:
      POSTGRES_USER: ${POSTGRES_OBS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OBS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_OBS_DB}
    volumes:
      - obs_data:/var/lib/postgresql/data
      - ./db/001_obs_schema.sql:/migrations/001_obs_schema.sql:ro
      - ./db/003_brain_schema.sql:/migrations/003_brain_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OBS_USER} -d ${POSTGRES_OBS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Do NOT expose port 5432 to the host. Internal traffic only.

  # ─── Postgres: Task Database ───────────────────────────────────────────────
  # Holds the task queue + review queue served by PostgREST. OAuth tokens are
  # NOT in this cluster — they live off-box at Composio. Keeping the task DB
  # as its own cluster preserves the "task-side bug cannot read brain" boundary.
  postgres-tasks:
    image: postgres:16-alpine
    container_name: safeclaw-postgres-tasks
    restart: unless-stopped
    networks:
      - safeclaw_net
    environment:
      POSTGRES_USER: ${POSTGRES_TASKS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TASKS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TASKS_DB}
    volumes:
      - tasks_data:/var/lib/postgresql/data
      - ./db/002_task_schema.sql:/migrations/002_task_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TASKS_USER} -d ${POSTGRES_TASKS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Do NOT expose port 5432 to the host.

  # ─── PostgREST — Task API ──────────────────────────────────────────────────
  postgrest:
    image: postgrest/postgrest:latest
    container_name: safeclaw-postgrest
    restart: unless-stopped
    networks:
      - safeclaw_net
    ports:
      - "127.0.0.1:3001:3000"   # Localhost-only. Do not expose to 0.0.0.0.
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_TASKS_USER}:${POSTGRES_TASKS_PASSWORD}@postgres-tasks:5432/${POSTGRES_TASKS_DB}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: tasks_anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_POOL: "10"
      PGRST_LOG_LEVEL: info
      PGRST_DB_MAX_ROWS: "500"
    depends_on:
      postgres-tasks:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/3000; echo -e \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── OAuth + per-toolkit MCP — handled off-box by Composio ────────────────
  # OAuth tokens for Gmail/Drive/Slack/etc. live in Composio's vault. Hermes
  # reaches them by talking to the Composio MCP servers (HTTP transport).
  # See COMPOSIO_READER_MCP_URL and COMPOSIO_ACTOR_MCP_URL in .env.

  # ─── rclone: Drive Mirror ──────────────────────────────────────────────────
  # Runs rclone sync on a 15-minute cron. Mirrors the client Drive folder to
  # ./drive-mirror/ on the host so hermes-reader can inspect file change events.
  rclone-sync:
    image: rclone/rclone:latest
    container_name: safeclaw-rclone
    restart: unless-stopped
    networks:
      - safeclaw_net
    environment:
      RCLONE_DRIVE_FOLDER_ID: ${RCLONE_DRIVE_FOLDER_ID}
    volumes:
      - drive_mirror:/data/drive-mirror
      # rclone config with Drive OAuth token — managed by Composio, mounted separately.
      # Operator must create this file after OAuth setup (see DEPLOY-RUNBOOK.md).
      - ./config/rclone.conf:/config/rclone/rclone.conf:ro
    command: >
      sh -c '
        echo "Starting rclone sync daemon (every 15 min)..." &&
        while true; do
          rclone sync \
            "gdrive:${RCLONE_DRIVE_FOLDER_ID}" \
            /data/drive-mirror \
            --drive-root-folder-id "${RCLONE_DRIVE_FOLDER_ID}" \
            --log-level INFO \
            --stats 0 \
            --transfers 4 \
            --checkers 8 &&
          echo "rclone sync complete at $(date)" ||
          echo "rclone sync FAILED at $(date)";
          sleep 900;
        done
      '

  # ─── Tasks API MCP Server ──────────────────────────────────────────────────
  # Runs the Node.js MCP server that wraps PostgREST for hermes-actor.
  tasks-api-mcp:
    image: ghcr.io/vasanth19/safeclaw-tasks-api:1.0
    # Dev-only: rebuild from source.
    # build:
    #   context: ./mcp-tools/tasks-api
    #   dockerfile: Dockerfile
    container_name: safeclaw-tasks-api-mcp
    # MCP servers run on stdio — Hermes spawns them via `docker exec`, so this
    # container is not meant to stay running as a standalone daemon.
    restart: "no"
    # Keep alive as a shell until Hermes exec's into it.
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'tasks-api-mcp ready; will be invoked via docker exec'; sleep infinity"]
    networks:
      - safeclaw_net
    environment:
      POSTGREST_URL: http://postgrest:3000
      TASKS_AGENT_JWT: ${TASKS_AGENT_JWT}
    depends_on:
      postgrest:
        condition: service_healthy

  # ─── hermes-reader — Read-Only Intake Agent ────────────────────────────────
  # Pulls the pre-built SafeClaw distribution image from GHCR (skill prune,
  # bind-mount fix, default session reset, and provider auto-pick all baked in).
  # Devs who want to rebuild from source can comment-toggle the build: block.
  hermes-reader:
    image: ghcr.io/vasanth19/safeclaw-hermes:1.0
    # Dev-only: rebuild from source instead of pulling from GHCR.
    # Uncomment to use; the image: tag above still controls the local tag name.
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.safeclaw-hermes
    container_name: safeclaw-hermes-reader
    restart: unless-stopped
    networks:
      - safeclaw_net
    # Linux Docker doesn't resolve host.docker.internal by default. The
    # extra_hosts shim maps it to the host gateway so Hermes can reach the
    # Ollama daemon installed by scripts/provision-vps.sh on :11434.
    # OrbStack on macOS handles this natively, but the entry is harmless there.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Same env_file approach as hermes-actor — bypass shell env override.
    env_file:
      - .env
    environment:
      HERMES_INFERENCE_PROVIDER: ollama-cloud
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_API_KEY: ollama-local
      HERMES_DEFAULT_MODEL: glm-5.1:cloud
      # Reader is a background ingest agent — it does NOT bind to Telegram.
      # The Actor owns the user-facing chat, so we blank the bot token here
      # to prevent the dual-poller getUpdates conflict.
      TELEGRAM_BOT_TOKEN: ""
    volumes:
      # Mount the operator config as a READ-ONLY template at a separate path.
      # safeclaw-entrypoint.sh COPIES it into /opt/data/config.yaml on startup
      # so the runtime can rewrite the file (/sethome, hermes config set) without
      # tripping the bind-mount "Device or resource busy" rename failure.
      - ./config/reader-hermes.yaml:/safeclaw/config-template/config.yaml:ro
      - hermes_reader_data:/opt/data
      # Brain mount is deferred — needs HERMES_UID/GID alignment to avoid
      # chown failure on bind-mount permissions. Agent reads brain via the
      # brain-api-mcp → postgres-obs path until we land the UID work.
    # Run as the long-lived daemon (gateway). The SafeClaw entrypoint handles
    # config-copy + privilege drop + skill sync, then hands off to hermes.
    command: ["gateway", "run", "--accept-hooks"]
    depends_on:
      - postgres-obs
      # reader also calls brain_recall / brain_get_soul (read-only brain access).
      - brain-api-mcp

  # ─── hermes-actor — Write/Action Agent (Phase 2+) ─────────────────────────
  # Disabled by default (ACTOR_ENABLED=false). Set ACTOR_ENABLED=true in .env
  # to start this service in Phase 2.
  hermes-actor:
    # Same pre-built SafeClaw distribution image as hermes-reader.
    image: ghcr.io/vasanth19/safeclaw-hermes:1.0
    # Dev-only: rebuild from source instead of pulling from GHCR.
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile.safeclaw-hermes
    container_name: safeclaw-hermes-actor
    restart: unless-stopped
    networks:
      - safeclaw_net
    # See note on hermes-reader. Required for Linux Docker so the actor
    # can reach the host's Ollama daemon at host.docker.internal:11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # env_file loads ALL .env values directly into the container, bypassing
    # docker-compose's `${VAR}` interpolation which prefers shell env over
    # .env file (and operator shells often carry stale values for some keys).
    env_file:
      - .env
    environment:
      # Hermes inference provider override — these are static, not from .env.
      HERMES_INFERENCE_PROVIDER: ollama-cloud
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_API_KEY: ollama-local
      # Kimi K2.5 — Moonshot's agentic model. Better at multi-step tool
      # routing than glm-5.1; required for the brain-first memory protocol.
      HERMES_DEFAULT_MODEL: kimi-k2.5:cloud
    volumes:
      # Operator config as read-only template; entrypoint copies it into
      # /opt/data/config.yaml so /sethome + `hermes config set` can rewrite.
      - ./config/actor-hermes.yaml:/safeclaw/config-template/config.yaml:ro
      - hermes_actor_data:/opt/data
      # Brain mount — read-only so the file skill can search People/, Companies/,
      # and the rest of the Evolving Brain layout. RO avoids the chown issue
      # (we only need to read; the Reader/embedder writes via DB, not files).
      - ./brain:/opt/brain:ro
    # Gate: exit cleanly if ACTOR_ENABLED is not true; otherwise run gateway daemon.
    # Use full path to `hermes` (the CLI binary), not `hermes-agent` (broken legacy).
    command: >
      sh -c '
        if [ "${ACTOR_ENABLED:-false}" != "true" ]; then
          echo "hermes-actor is disabled (ACTOR_ENABLED=${ACTOR_ENABLED:-false}). Set ACTOR_ENABLED=true to enable.";
          exit 0;
        fi;
        exec /opt/hermes/.venv/bin/hermes gateway run --accept-hooks
      '
    depends_on:
      - postgrest
      - tasks-api-mcp
      - hermes-reader   # reader pulls the shared image; actor reuses it
      - brain-api-mcp

  # ─── Brain: Embedder ───────────────────────────────────────────────────────
  # Polls postgres-obs every 30s for rows missing embeddings (observations,
  # facts, style_samples) and writes 384-dim vectors via pgvector. Also runs a
  # tiny HTTP server on :8000 so brain-api can turn queries into vectors.
  embedder:
    image: ghcr.io/vasanth19/safeclaw-embedder:1.0
    # Dev-only: rebuild from source.
    # build:
    #   context: ./services/embedder
    #   dockerfile: Dockerfile
    container_name: safeclaw-embedder
    restart: unless-stopped
    networks:
      - safeclaw_net
    ports:
      - "127.0.0.1:8000:8000"   # Localhost-only; internal clients use http://embedder:8000.
    environment:
      DATABASE_URL: ${BRAIN_OBS_DATABASE_URL}
      BRAIN_EMBEDDING_MODEL: ${BRAIN_EMBEDDING_MODEL}
    depends_on:
      postgres-obs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/health\", timeout=3).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─── Brain: Reflector ──────────────────────────────────────────────────────
  # Runs at startup, then weekly (Mon 06:00 UTC). Reads observations + review
  # feedback, proposes Soul + preference updates to soul_revisions / review_queue.
  reflector:
    build:
      context: ./services/reflector
      dockerfile: Dockerfile
    image: safeclaw/reflector:local
    container_name: safeclaw-reflector
    restart: unless-stopped
    networks:
      - safeclaw_net
    environment:
      DATABASE_URL: ${BRAIN_OBS_DATABASE_URL}
      HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY}
      HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL}
      HERMES_MODEL: ${HERMES_MODEL}
      BRAIN_USER_KEY: ${BRAIN_USER_KEY}
    depends_on:
      postgres-obs:
        condition: service_healthy

  # ─── Brain: MCP Server ─────────────────────────────────────────────────────
  # TypeScript MCP server exposing brain_recall / brain_write / brain_get_soul /
  # brain_list_relationships to hermes-reader and hermes-actor.
  brain-api-mcp:
    image: ghcr.io/vasanth19/safeclaw-brain-api:1.0
    # Dev-only: rebuild from source.
    # build:
    #   context: ./mcp-tools/brain-api
    #   dockerfile: Dockerfile
    container_name: safeclaw-brain-api-mcp
    # Same stdio MCP model as tasks-api-mcp — kept alive for docker exec invocation.
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["echo 'brain-api-mcp ready; will be invoked via docker exec'; sleep infinity"]
    networks:
      - safeclaw_net
    environment:
      DATABASE_URL: ${BRAIN_OBS_DATABASE_URL}
      EMBEDDER_URL: ${BRAIN_EMBEDDER_URL}
      BRAIN_USER_KEY: ${BRAIN_USER_KEY}
    depends_on:
      postgres-obs:
        condition: service_healthy
      embedder:
        condition: service_started

  # ─── Onboarding webapp ────────────────────────────────────────────────────
  # Customer self-service install UI — Flask + SSE on port 8080. Fronted by
  # Caddy on the host (provision-vps.sh sets up the reverse proxy + SSL).
  # The webapp IS the installer: writes .env, runs init-secrets, drives
  # `docker compose up -d` to boot the rest of the stack on customer Submit.
  onboarding:
    build: ./onboarding
    image: safeclaw/onboarding:1.0
    container_name: safeclaw-onboarding
    restart: unless-stopped
    networks:
      - safeclaw_net
    ports:
      # Localhost-only — Caddy on the host terminates TLS at 443 and proxies here.
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/safeclaw:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SAFECLAW_INSTALL_DIR: /safeclaw
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
