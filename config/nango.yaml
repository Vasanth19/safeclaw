# Nango integration definitions — SafeClaw
# Deploy: these are loaded by the Nango server on startup or via `nango deploy`.
# Docs: https://docs.nango.dev/reference/integration-configuration

integrations:
  # ── Gmail: read-only (hermes-reader) ─────────────────────────────────────────
  gmail-readonly:
    provider: google
    auth_mode: OAUTH2
    credentials:
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
    oauth_scopes:
      - https://www.googleapis.com/auth/gmail.readonly
      - https://www.googleapis.com/auth/gmail.labels
    # Nango handles token refresh automatically.
    # Connections are added per inbox via setup-oauth.sh.
    connection_config:
      # Prompt for account selection to allow multiple Gmail accounts.
      params: "access_type=offline&prompt=consent&include_granted_scopes=false"

  # ── Gmail: draft only (hermes-actor) ─────────────────────────────────────────
  gmail-draft:
    provider: google
    auth_mode: OAUTH2
    credentials:
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
    oauth_scopes:
      - https://www.googleapis.com/auth/gmail.compose
    connection_config:
      params: "access_type=offline&prompt=consent&include_granted_scopes=false"

  # ── Google Drive: app-folder only (hermes-actor) ──────────────────────────────
  # drive.file scope restricts access to files created by or explicitly opened
  # with this app — cannot see the rest of the Drive.
  google-drive-file:
    provider: google
    auth_mode: OAUTH2
    credentials:
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
    oauth_scopes:
      - https://www.googleapis.com/auth/drive.file
    connection_config:
      params: "access_type=offline&prompt=consent&include_granted_scopes=false"

  # ── Slack bot (hermes-actor + hermes-reader) ──────────────────────────────────
  # Socket Mode is configured in the Slack App dashboard, not here.
  # Bot token scopes requested during OAuth installation:
  slack-bot:
    provider: slack
    auth_mode: OAUTH2
    credentials:
      client_id: "${SLACK_CLIENT_ID}"
      client_secret: "${SLACK_CLIENT_SECRET}"
    oauth_scopes:
      - channels:read
      - channels:history
      - chat:write
      - chat:write.public
