# PostgREST configuration — SafeClaw task API
# Docs: https://postgrest.org/en/stable/references/configuration.html

# Database connection — points to postgres-tasks container only.
# Never connects to postgres-obs (observation DB is not exposed via REST).
db-uri = "postgres://tasks_super:${POSTGRES_TASKS_PASSWORD}@postgres-tasks:5432/safeclaw_tasks"

# Only expose the public schema.
db-schema = "public"

# Unauthenticated requests fall through to tasks_anon (which has no grants).
db-anon-role = "tasks_anon"

# JWT secret must match the value used to sign TASKS_AGENT_JWT.
# PostgREST will refuse any token signed with a different secret.
jwt-secret = "${JWT_SECRET}"

# Server port inside the container. docker-compose maps this to host port 3001.
server-port = 3000

# Connection pool size. 10 is sufficient for a single-agent setup.
db-pool = 10

# Structured log output at info level. Use 'warn' in production to reduce noise.
log-level = "info"

# Disable the /rpc endpoint for raw function calls — agent uses only table endpoints.
db-pre-request = ""

# Limit max rows returned per request to prevent accidental full-table dumps.
db-max-rows = 500
