# SafeClaw — hermes-actor configuration (Composio MCP backend)
# Mounted into the container at /opt/data/config.yaml.
#
# Role: write/action agent. Drafts, posts, and Drive ops via Composio MCP.
# Trust split: has private-data + exfiltration capability but NO untrusted input
# in context — only reads structured observations + receives explicit human commands.

agent:
  name: safeclaw-actor
  description: >
    Receive structured observations + human commands, execute actions.
    Drafts only (no auto-send in v1). Slack posts approval cards to #safeclaw-review.

model:
  # `custom` = generic OpenAI-compatible endpoint (per `hermes setup` hint).
  # We point at local Ollama daemon which proxies :cloud models to ollama.com.
  provider: custom
  base_url: http://host.docker.internal:11434/v1
  api_key: ollama-local
  # Hermes uses `default:` (the default model), not `name:` — unlike most agent runtimes.
  default: glm-5.1:cloud
  temperature: 0.2

# ── MCP Servers ──────────────────────────────────────────────────────────────
# Composio actor MCP exposes 10 tools across Gmail (draft + reply), Slack
# (send), Drive (move/find/upload/create_folder).
mcp_servers:
  composio_actor:
    url: "${COMPOSIO_ACTOR_MCP_URL}"
    headers:
      x-api-key: "${COMPOSIO_API_KEY}"
      x-composio-user-id: "${COMPOSIO_USER_ID}"
    timeout: 120
    connect_timeout: 30

system_prompt: |
  You are SafeClaw Actor — the write-side agent.

  You receive:
    1. Structured observations from the obs DB (already parsed, safe).
    2. Direct human commands via Slack mentions.

  You do NOT receive raw untrusted email bodies in your context. If a
  task requires email content, the Reader has already summarized it
  in an observation row — read that, don't re-fetch the raw body.

  You may:
    - Create Gmail drafts (gmail.drafts.create) — never send.
    - Post messages to Slack — only approved-action posts; routine
      proposals go to #safeclaw-review as approval cards first.
    - Move/rename files within the app-owned Drive folder (drive.file scope).

  You may NOT:
    - Send emails directly (Phase 1 is drafts only).
    - Delete files in Drive.
    - Call external HTTP endpoints not in your MCP allowlist.

  When drafting on the user's behalf:
    1. Use brain_recall to look up the recipient's relationship + style.
    2. Pull 3-5 of the user's past emails to similar contacts as few-shot.
    3. Match the user's tone (terse vs warm, formal vs casual).
    4. Open with the ask, not pleasantries (per learned preferences).

# ── Scheduled automations (cron) ─────────────────────────────────────────────
schedules:
  morning_briefing:
    cron: "0 7 * * *"
    description: "Query obs DB for overnight critical_alerts → post digest to #safeclaw-review"
  reminder_scan:
    cron: "0 15 * * *"
    description: "Tasks due today → reminder cards in #safeclaw-review"
  critical_digest:
    cron: "0 18 * * *"
    description: "Today's critical_alerts summary → #safeclaw-review"

# ── Feature flags ────────────────────────────────────────────────────────────
features:
  auto_send_enabled: "${AUTO_SEND_ENABLED}"   # Phase 4 — gated by 30-day clean run

skills:
  enabled:
    - core
    - mcp/native-mcp
